# Configuration centralisée du Journal de bord (cf. cahier des charges, NFR "Maintenabilité").
# Toute valeur ajustable par l'équipe pendant la semaine de workshop vit ici,
# jamais en dur dans le code.

app:
  name: "Journal de bord de la navette"
  debug: true

# La configuration de la base de données (utilisateur, mot de passe, URL de
# connexion) n'est pas ici : elle vient du fichier .env, jamais commité.
# Voir .env.example à la racine du projet.

ollama:
  base_url: "http://localhost:11434"  # en local hors Docker ; dans Docker, voir OLLAMA_BASE_URL dans docker-compose.yml
  model: "qwen2.5:3b"
  enabled: true
  timeout_seconds: 105 # JRN : laisse de la marge sous la limite de 2 min (STA... US-5.1, critère 2)

scheduler:
  enabled: true
  navigation_calculation_hour: 0 # NAV-01 : heure fixe du calcul de position quotidien (0-23)
  observation_interval_minutes: 60 # OBS-01 : intervalle des prises de vue automatiques
  dht22_read_interval_minutes: 15 # STA-01 : intervalle des relevés du capteur
  simulation_interval_minutes: 20 # STA-02 : intervalle des données simulées
  journal_generation_hour: 22 # JRN-01 : heure fixe de génération quotidienne (0-23)

alerts:
  # STA-05 : seuils déclenchant une alerte + incident automatique
  oxygene_min: 19.5
  temperature_min: 15.0
  temperature_max: 30.0
  humidite_max: 70.0

navigation:
  vitesse_defaut: 12.5 # unités de distance / jour
  position_initiale:
    x: 0.0
    y: 0.0
    z: 0.0
  destination:
    nom: "Proxima b"
    x: 4200.0
    y: 1800.0
    z: 900.0

camera:
  capture_dir: "../data/captures"
  # Chemin fixe utile pour les tests / démo (ex: capture Stellarium pré-enregistrée).
  # Laisser null pour capturer depuis la webcam pointée sur l'écran du planétarium.
  source_image: null

astrometry:
  solve_field_path: "solve-field" # binaire astrometry.net, doit être dans le PATH du conteneur
  index_dir: "../data/astrometry_index"
  timeout_seconds: 60

dht22:
  serial_port: "COM3"
  baud_rate: 9600
  read_timeout_seconds: 5
  secteur: "Pont" # secteur auquel ce capteur est rattaché (STA-01)

# STA-02 : chaque simulateur peut être activé/désactivé indépendamment.
simulateurs:
  oxygene: true
  stocks: true
  maintenance: true
  secteurs: true # CO2, pression, température, humidité et occupation par secteur (panneau "Secteurs" du Bord)
  reserves: true # fait descendre les réserves ci-dessous au fil du temps (panneau "Réserves et besoins")

# Réserves générales du vaisseau, affichées sur le panneau "Réserves et
# besoins" du Bord. Aucun capteur réel derrière : quantités et
# consommation inventées pour la démo, qui descendent au fil du temps
# (voir services/simulateur.py, simuler_reserves).
reserves:
  eau:
    libelle: "Eau potable"
    quantite_initiale: 18400
    unite: "L"
    consommation_par_jour: 310
  nourriture:
    libelle: "Rations alimentaires"
    quantite_initiale: 2150
    unite: "rations"
    consommation_par_jour: 36
  lioh:
    libelle: "Cartouches LiOH (CO2)"
    quantite_initiale: 14
    unite: "cartouches"
    consommation_par_jour: 0.5
  azote:
    libelle: "Réserve d'azote"
    quantite_initiale: 312
    unite: "kg"
    consommation_par_jour: 2.1

# STA-04 : d'où vient l'effectif à bord.
# "simulee" : générée ici automatiquement. "reelle" : envoyée par un autre
# projet (la caméra à reconnaissance faciale) via POST /api/population.
population:
  source: "simulee"
  simulee_min: 8
  simulee_max: 14

# Secteurs créés au premier démarrage si la table est vide.
secteurs_initiaux:
  - "Pont"
  - "Serre"
  - "Dortoirs"
  - "Machinerie"
  - "Laboratoire"
