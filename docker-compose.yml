services:
  db:
    image: postgres:16-alpine
    container_name: journal-db
    env_file:
      - .env  # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB (voir .env.example)
    ports:
      - "5432:5432"  # exposé pour pouvoir inspecter la base depuis l'hôte (psql, DBeaver...)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: journal-backend
    ports:
      - "8000:8000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./frontend:/app/frontend:ro
      - ./data:/app/data
    environment:
      - CONFIG_PATH=/app/config.yaml
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: journal-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    # Après le premier démarrage : docker exec journal-ollama ollama pull qwen2.5:3b

  adminer:
    image: adminer:latest
    container_name: journal-adminer
    ports:
      - "8080:8080"
    depends_on:
      - db
    restart: unless-stopped
    # Interface web pour voir les tables (équivalent phpMyAdmin) : http://localhost:8080
    # Système : PostgreSQL / Serveur : db / identifiants : voir votre fichier .env

volumes:
  postgres_data:
  ollama_data:

# Les identifiants Postgres viennent de .env (non versionné, voir .env.example).
